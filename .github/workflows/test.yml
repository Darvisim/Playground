name: Test Termux action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Termux
        uses: Darvisim/Playground@main
        with:
          arch: x86_64

      - name: Run parallel Termux tests
        shell: termux {0}
        run: |
          chmod +x ./tests/termux_tests.sh
          ./tests/termux_tests.sh

      - name: Run normal Termux tests
        shell: termux {0}
        run: |
          pkg install -y tree
          package_version="$(dpkg-query -W -f='${Version}' tree)"
          package_path="$(command -v tree)"
          test -n "$package_version"
          case "$package_path" in
            "$PREFIX"/bin/*) ;;
            *) printf 'Unexpected tree install path: %s\n' "$package_path" >&2; exit 1 ;;
          esac
          printf 'tree version: %s\ninstalled at: %s\n' "$package_version" "$package_path"

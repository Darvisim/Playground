name: Test Termux action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Termux
        uses: Darvisim/Playground@main
        with:
          arch: x86_64

      - name: Run smoke test in Termux
        shell: termux {0}
        run: |
          test -x "$PREFIX/bin/bash"
          printf 'Termux CI ready: %s\n' "$PREFIX"
          bash --version

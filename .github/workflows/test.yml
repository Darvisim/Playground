name: Test Termux action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Termux and run smoke test
        uses: Darvisim/Playground@main
        with:
          api-level: "30"
          arch: x86_64
          termux-apk-url: https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_universal.apk
          command: |
            set -eu
            test -x "$PREFIX/bin/bash"
            printf 'Termux CI ready: %s\n' "$PREFIX"
            bash --version

name: Setup Termux
description: Run a command in Termux on an Android emulator

inputs:
  termux-apk-url:
    description: URL of a debuggable Termux APK
    required: true
  command:
    description: Shell script to execute inside Termux
    required: true
  api-level:
    description: Android emulator API level
    required: false
    default: "30"
  arch:
    description: Android emulator architecture
    required: false
    default: x86_64

runs:
  using: composite
  steps:
    - name: Enable KVM group perms
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        
    - name: Boot emulator and run Termux
      uses: reactivecircus/android-emulator-runner@v2
      env:
        TERMUX_APK_URL: ${{ inputs.termux-apk-url }}
        TERMUX_COMMAND: ${{ inputs.command }}
      with:
        api-level: ${{ inputs.api-level }}
        arch: ${{ inputs.arch }}
        target: google_apis
        profile: pixel_2
        script: |
          set -eu

          : "${TERMUX_APK_URL:?termux-apk-url input is empty or missing}"
          : "${TERMUX_COMMAND:?command input is empty or missing}"

          apk=/tmp/termux.apk
          curl --fail --location "$TERMUX_APK_URL" --output "$apk"
          adb install "$apk"
          adb shell monkey -p com.termux 1 >/dev/null

          prefix=/data/data/com.termux/files/usr
          home=/data/data/com.termux/files/home
          ready=false

          for attempt in $(seq 1 120); do
            if adb shell run-as com.termux test -x "$prefix/bin/bash" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Termux bootstrap did not finish in time."
            adb logcat -d -t 200 >&2 || true
            exit 1
          fi

          command_b64="$(printf '%s' "$TERMUX_COMMAND" | base64 | tr -d '\n')"

          adb shell run-as com.termux /system/bin/sh -s <<EOF
          set -e
          export PREFIX=$prefix
          export HOME=$home
          export TMPDIR=$prefix/tmp
          export PATH=$prefix/bin
          export LD_LIBRARY_PATH=$prefix/lib
          export LD_PRELOAD=$prefix/lib/libtermux-exec.so
          export LANG=en_US.UTF-8
          export TERM=xterm-256color
          printf '%s' '$command_b64' | "\$PREFIX/bin/base64" -d | "\$PREFIX/bin/bash" -s
          EOF
